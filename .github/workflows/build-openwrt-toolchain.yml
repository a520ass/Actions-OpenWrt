
name: Build OpenWrt Toolchain

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      repo_url:
        description: 'REPO URL'
        required: true
        default: 'https://github.com/a520ass/openwrt'
      repo_branch:
        description: 'REPO BRANCH'
        required: true
        default: 'meson'
      patch_version:
        description: 'PATCH VERSION'
        required: true
        default: 'meson'
      config_file:
        description: 'CONFIG FILE'
        required: true
        default: 'meson.config'
      p1_sh:
        description: 'DIY P1 SH (OR PATCH SH)'
        required: true
        default: 'diy-part1.sh'
      p2_sh:
        description: 'DIY P2 SH'
        required: true
        default: 'diy-part2.sh'
      upload_bin:
        description: 'upload build dir'
        required: true
        default: 'true'

env:
  REPO_URL: ${{ inputs.repo_url }}
  REPO_BRANCH: ${{ inputs.repo_branch }}
  PATCH_VERSION: ${{ inputs.patch_version }}
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ inputs.config_file }}
  DIY_P1_SH: ${{ inputs.p1_sh }}
  DIY_P2_SH: ${{ inputs.p2_sh }}
  UPLOAD_BIN_DIR: ${{ inputs.upload_bin }}
  UPLOAD_FIRMWARE: true
  UPLOAD_WSS: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget patchutils android-sdk-libsparse-utils mkbootimg tree
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          # tools 的 .prepared 标记文件名里带源码文件的修改时间，固定时间后缓存的工具链才能被识别
          find openwrt/tools openwrt/toolchain -exec touch -h -d @1600000000 {} +
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          [ -e build-files ] && mv build-files openwrt/build-files
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH ${{ env.PATCH_VERSION }}

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH ${{ env.PATCH_VERSION }}
      
      - name: start frpc
        uses: a520ass/frpc_action@main
        with:
          users: runner
          run_daemon: true
          authorized_keys: ${{ secrets.AUTHORIZED_KEYS }}
          host_key: ${{ secrets.HOST_KEY }}
          config: ${{ secrets.FRPC_SERVER_CONF }}

      - name: Download package
        id: package
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
      
      - name: Restore cached 
        id: cache-openwrt-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/build_dir
            openwrt/staging_dir
            openwrt/tools
            openwrt/toolchain
            openwrt/tmp
          key: ${{ runner.os }}-openwrt-${{ env.REPO_BRANCH }}-${{ env.CONFIG_FILE }}

      - name: Compile toolchain
        id: compile-toolchain
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile toolchain"
          make -j$(nproc) tools/install toolchain/install || make -j1 V=s tools/install toolchain/install
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "不编译，只缓存"
          echo "DEVICE_NAME=_NEW" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: sendMsg And wait
        id: sendMsg
        if: failure() || (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false' && !cancelled())
        run: |
          wget --no-check-certificate -q -O - "http://www.pushplus.plus/send?token=${{ secrets.PUSHPLUS_TOKEN }}&title=BUILD_MSG&content=BUILD_OP_WAIT&template=html"
          touch /tmp/hf.lock
          lock_file=/tmp/hf.lock
          count=0
          max_display=10

          # 循环等待直到文件不存在
          while [ -f "$lock_file" ]; do
              sleep 30
              if [ $count -lt $max_display ]; then
                  echo "/tmp/hf.lock 文件存在,继续等待... ($((count+1))/$max_display)"
                  count=$((count+1))
              fi
          done
          echo "继续执行后续操作..."

      - name: Check space usage and check bin
        if: (!cancelled())
        run: |
          df -hT
          cd openwrt
          tree bin
          
      - name: targz build dir
        if: env.UPLOAD_BIN_DIR == 'true' && !cancelled()
        run: |
          cd openwrt
          mkdir buildcache
          cd buildcache
          tar -czf bin.tar.gz bin
          tar -czf dl.tar.gz dl
          tar -czf feeds.tar.gz feeds
          tar -czf build_dir.tar.gz build_dir
          tar -czf staging_dir.tar.gz staging_dir

      - name: Organize files
        id: organize
        run: |
          cd openwrt/buildcache
          ls -lh
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Generate release tag
        id: tag
        if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "::set-output name=release_tag::$(date +"%Y.%m.%d-%H%M")"
          touch release.txt
          [ $UPLOAD_WSS = true ] && echo "🔗 [Wenshushu](${{ steps.wenshushu.outputs.url }})" >> release.txt
          echo "自定义构建参数" >> release.txt
          echo "REPO_URL: $REPO_URL" >> release.txt
          echo "REPO_BRANCH: $REPO_BRANCH" >> release.txt
          echo "PATCH_VERSION: $PATCH_VERSION" >> release.txt
          echo "FEEDS_CONF: $FEEDS_CONF" >> release.txt
          echo "CONFIG_FILE: $CONFIG_FILE" >> release.txt
          echo "DIY_P1_SH: $DIY_P1_SH" >> release.txt
          echo "DIY_P2_SH: $DIY_P2_SH" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Create Release for this commit
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="buildcache-${{ steps.tag.outputs.release_tag }}"
          date_str="$(date -u +%Y-%m-%d)"
          title="OpenWrt Cache build: ${{ steps.tag.outputs.release_tag }}"
          notes="Automated release for commit ${GITHUB_SHA} on ${GITHUB_REF_NAME}"

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file release.txt \
            "${{ env.FIRMWARE }}/*"
